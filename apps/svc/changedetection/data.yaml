apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: changedetection
spec:
  storageClassName: oci-bv
  volumeName: data
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: foo-pv
spec:
  storageClassName: oci-bv
  claimRef:
    name: data
    namespace: changedetection
  capacity:
    storage: 1Gi