apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: changedetection
spec:
  storageClassName: oci-bv
  volumeName: data
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: data
spec:
  storageClassName: oci-bv
  claimRef:
    name: data
    namespace: changedetection
  capacity:
    storage: 1Gi