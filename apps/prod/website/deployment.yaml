apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
spec:
  template:
    spec:
      containers:
        - name: website
          livenessProbe:
            httpGet:
              path: /WeatherForecast
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 10
          env:
            - name: NEW_RELIC_APP_NAME
              value: "production-website"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: production-database-app
                  key: host
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: production-database-app
                  key: password