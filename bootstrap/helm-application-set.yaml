apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: helm-application-set
spec:
  generators:
    - list:
        elements:
          - appName: argocd
            namespace: argocd
            chart: oci://ghcr.io/argoproj/argo-helm/argo-cd
            version: 9.2.3
  template:
    metadata:
      name: "{{appName}}"
      annotations:
        argocd.argoproj.io/manifest-generate-paths: ".;.."
    spec:
      project: helm
      sources:
        - repoURL: "{{chart}}"
          chart: "{{appName}}"
          targetRevision: "{{version}}"
          helm:
            # Release name override (defaults to application name)
            releaseName: "{{appName}}"
            valueFiles:
              - '$valuesRef/apps/helm/{{appName}}/values.yaml'
        - repoURL: 'https://github.com/oikz/kubernetes-cluster.git'
          targetRevision: HEAD
          ref: valuesRef
      destination:
        # Default base cluster
        name: in-cluster
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true 