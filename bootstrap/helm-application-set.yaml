apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: helm-application-set
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - appName: argocd
            namespace: argocd
            chart: oci://ghcr.io/argoproj/argo-helm/argo-cd
            version: 10.18.0
          - appName: cert-manager
            namespace: cert-manager
            chart: oci://quay.io/jetstack/charts/cert-manager
            version: v1.21.2
          - appName: cloudnative-pg
            namespace: cnpg-system
            chart: https://cloudnative-pg.io/charts
            version: 0.29.1
          - appName: traefik
            namespace: traefik
            chart: https://traefik.github.io/charts
            version: 41.7.0
          - appName: gha-runner-scale-set-controller
            namespace: arc-systems
            chart: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller
            version: 0.15.0
          - appName: gha-runner-scale-set
            namespace: arc-runners
            chart: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
            version: 0.15.0
          - appName: metrics-server
            namespace: metrics-server
            chart: https://kubernetes-sigs.github.io/metrics-server/
            version: 3.13.1
          - appName: opentelemetry-collector
            namespace: honeycomb
            chart: https://open-telemetry.github.io/opentelemetry-helm-charts
            version: 0.178.2
          - appName: opentelemetry-collector-cluster
            # Same chart as above, deployed in deployment mode for cluster-level metrics/events
            chartName: opentelemetry-collector
            namespace: honeycomb
            chart: https://open-telemetry.github.io/opentelemetry-helm-charts
            version: 0.178.2
          - appName: opentelemetry-operator
            namespace: honeycomb
            chart: https://open-telemetry.github.io/opentelemetry-helm-charts
            version: 0.128.0
          - appName: external-dns
            namespace: external-dns
            chart: https://kubernetes-sigs.github.io/external-dns/
            version: 1.23.0
  template:
    metadata:
      name: "{{ .appName }}"
      annotations:
        argocd.argoproj.io/manifest-generate-paths: ".;.."
    spec:
      project: helm
      sources:
        - repoURL: "{{ .chart }}"
          # Chart name defaults to appName unless chartName is set
          chart: "{{ default .appName .chartName }}"
          targetRevision: "{{ .version }}"
          helm:
            # Release name override (defaults to application name)
            releaseName: "{{ .appName }}"
            valueFiles:
              - '$valuesRef/apps/helm/{{ .appName }}/values.yaml'
        - repoURL: 'https://github.com/oikz/kubernetes-cluster.git'
          targetRevision: HEAD
          ref: valuesRef
      destination:
        # Default base cluster
        name: in-cluster
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
