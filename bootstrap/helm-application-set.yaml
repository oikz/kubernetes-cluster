apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: helm-application-set
spec:
  generators:
    - list:
        elements:
          - appName: argocd
            namespace: argocd
            chart: oci://ghcr.io/argoproj/argo-helm/argo-cd
            version: 9.2.3
          - appName: kubernetes-dashboard
            namespace: kubernetes-dashboard
            chart: https://kubernetes.github.io/dashboard
            version: 7.14.0
          - appName: cert-manager
            namespace: cert-manager
            chart: oci://quay.io/jetstack/charts/cert-manager
            version: 1.19.2
          - appName: uptime-kuma
            namespace: uptime-kuma
            chart: https://helm.irsigler.cloud
            version: 2.24.0
          - appName: cloudnative-pg
            namespace: cnpg-system
            chart: https://cloudnative-pg.io/charts
            version: 0.27.0
          - appName: traefik
            namespace: traefik
            chart: https://traefik.github.io/charts
            version: 38.0.1
          - appName: signoz
            namespace: signoz
            chart: https://charts.signoz.io
            version: 0.107.0
          - appName: k8s-infra
            namespace: signoz
            chart: https://charts.signoz.io
            version: 0.15.0
          - appName: gha-runner-scale-set-controller
            namespace: arc-systems
            chart: oci://ghcr.io/actions/actions-runner-controller-charts/
            version: 0.13.1
          - appName: gha-runner-scale-set
            namespace: arc-runners
            chart: oci://ghcr.io/actions/actions-runner-controller-charts/
            version: 0.13.1
  template:
    metadata:
      name: "{{appName}}"
      annotations:
        argocd.argoproj.io/manifest-generate-paths: ".;.."
    spec:
      project: helm
      sources:
        - repoURL: "{{chart}}"
          chart: "{{appName}}"
          targetRevision: "{{version}}"
          helm:
            # Release name override (defaults to application name)
            releaseName: "{{appName}}"
            valueFiles:
              - '$valuesRef/apps/helm/{{appName}}/values.yaml'
        - repoURL: 'https://github.com/oikz/kubernetes-cluster.git'
          targetRevision: HEAD
          ref: valuesRef
      destination:
        # Default base cluster
        name: in-cluster
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true 