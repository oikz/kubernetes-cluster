apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: helm-application-set
spec:
  generators:
    - list:
        elements:
          - appName: argocd
            namespace: argocd
            chart: oci://ghcr.io/argoproj/argo-helm/argo-cd
            version: 9.7.0
          - appName: headlamp
            namespace: headlamp
            chart: https://kubernetes-sigs.github.io/headlamp
            version: v0.39.0
          - appName: cert-manager
            namespace: cert-manager
            chart: oci://quay.io/jetstack/charts/cert-manager
            version: 1.19.2
          - appName: cloudnative-pg
            namespace: cnpg-system
            chart: https://cloudnative-pg.io/charts
            version: 0.27.0
          - appName: traefik
            namespace: traefik
            chart: https://traefik.github.io/charts
            version: 38.0.1
          - appName: gha-runner-scale-set-controller
            namespace: arc-systems
            chart: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller
            version: 0.13.1
          - appName: gha-runner-scale-set
            namespace: arc-runners
            chart: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
            version: 0.13.1
          - appName: metrics-server
            namespace: metrics-server
            chart: https://kubernetes-sigs.github.io/metrics-server/
            version: 3.13.1
          - appName: nri-bundle
            namespace: newrelic
            chart: https://helm-charts.newrelic.com
            version: 6.0.32
          - appName: external-dns
            namespace: external-dns
            chart: https://kubernetes-sigs.github.io/external-dns/
            version: 1.21.1
  template:
    metadata:
      name: "{{appName}}"
      annotations:
        argocd.argoproj.io/manifest-generate-paths: ".;.."
    spec:
      project: helm
      sources:
        - repoURL: "{{chart}}"
          chart: "{{appName}}"
          targetRevision: "{{version}}"
          helm:
            # Release name override (defaults to application name)
            releaseName: "{{appName}}"
            valueFiles:
              - '$valuesRef/apps/helm/{{appName}}/values.yaml'
        - repoURL: 'https://github.com/oikz/kubernetes-cluster.git'
          targetRevision: HEAD
          ref: valuesRef
      destination:
        # Default base cluster
        name: in-cluster
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true 
