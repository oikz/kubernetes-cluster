apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-website
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-deployed.newrelic: ""
    newrelic.com/entity-guid: "NzU0MDcyN3xBUE18QVBQTElDQVRJT058MTExMTE5MzY0NA"
spec:
  project: prod
  source:
    repoURL: https://github.com/oikz/kubernetes-cluster.git
    targetRevision: HEAD
    path: apps/prod/website
  destination:
    server: https://kubernetes.default.svc
    namespace: website
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
